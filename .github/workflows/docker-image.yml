# ============================================================================
# 构建并发布 DSH 基础镜像到 GitHub Container Registry (ghcr.io)
#
# 触发：
#   - 推送 v* tag（如 v1.0.0）→ 镜像 tag 为版本号 + latest
#   - 推送 main 分支 → 镜像 tag 为 main
#
# 说明：镜像只含运行环境（node:24 + git + socat + entrypoint），不含 DSH 程序
# 本体（程序在容器启动时装入挂载卷 /opt/dsh，见 entrypoint.sh）。
# ============================================================================

name: build-and-push-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ★ 改为你的 GitHub 用户名或组织名（小写）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构构建需要）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # ghcr.io 要求镜像名全小写（github.repository 可能含大写）
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${{ env.REGISTRY }}/${IMAGE_LOWER}:${{ github.ref_name }},${{ env.REGISTRY }}/${IMAGE_LOWER}:latest"
          else
            TAGS="${{ env.REGISTRY }}/${IMAGE_LOWER}:main"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
